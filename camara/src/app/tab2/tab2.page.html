<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Photo Gallery</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Photo Gallery</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Selector de calidad -->
  <ion-segment [value]="photoService.quality">
    <!-- CAMBIO: se agregó id="quality-60" -->
    <ion-segment-button id="quality-60" [value]="60" (click)="setQuality(60)">
      <ion-label>Calidad 60</ion-label>
    </ion-segment-button>
    <!-- CAMBIO: se agregó id="quality-100" -->
    <ion-segment-button id="quality-100" [value]="100" (click)="setQuality(100)">
      <ion-label>Calidad 100</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- CAMBIO: toasts declarativos, cada uno ligado a su botón -->
  <ion-toast
    trigger="quality-60"
    message="Calidad reducida: tus próximas fotos pesarán menos, pero se verán con menor calidad."
    [duration]="2500"
    position="top"
    color="medium"
  ></ion-toast>

  <ion-toast
    trigger="quality-100"
    message="Calidad máxima: tus próximas fotos se verán mejor, pero pesarán más."
    [duration]="2500"
    position="top"
    color="medium"
  ></ion-toast>

  <!-- Cuadrícula para mostrar las fotos -->
  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos; track photo.filepath; let i = $index) {
        <ion-col size="6">
          <img [src]="photo.webviewPath" [alt]="'Photo ' + (i + 1)" loading="lazy" />
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
